spring.application.name=trego-api
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:trails}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:trails}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.mvc.problemdetails.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
api.cors.allowed-origins=${API_CORS_ALLOWED_ORIGINS:http://localhost:5173}
routing.ors.base-url=${ORS_BASE_URL:https://api.heigit.org/openrouteservice}
routing.ors.api-key=${ORS_API_KEY:}
routing.ors.connect-timeout=${ORS_CONNECT_TIMEOUT:5s}
routing.ors.read-timeout=${ORS_READ_TIMEOUT:20s}
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379/0}
spring.data.redis.connect-timeout=${API_VALKEY_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${API_VALKEY_COMMAND_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false
media.enabled=${API_MEDIA_ENABLED:false}
media.auto-discovery-enabled=${API_MEDIA_AUTO_DISCOVERY_ENABLED:true}
media.lookup-timeout=${API_MEDIA_LOOKUP_TIMEOUT:12s}
media.connect-timeout=${API_MEDIA_CONNECT_TIMEOUT:2s}
media.nominatim-base-url=${API_MEDIA_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
media.wikidata-url=${API_MEDIA_WIKIDATA_URL:https://www.wikidata.org/w/api.php}
media.commons-url=${API_MEDIA_COMMONS_URL:https://commons.wikimedia.org/w/api.php}
media.user-agent=${API_MEDIA_USER_AGENT:trego/0.1 (contact: https://github.com/uksus148/trego./issues)}
media.catalog=${API_MEDIA_CATALOG:classpath:media/catalog.json}
