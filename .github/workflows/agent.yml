name: Agent checks

on:
  pull_request:
    paths:
      - 'agent/**'
      - '.env.example'
      - '.github/workflows/agent.yml'

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      valkey:
        image: valkey/valkey:8.1-alpine
        options: --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 1s --health-retries 10
        ports:
          - 6379:6379
    env:
      TEST_VALKEY_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Validate agent without live credentials
        working-directory: agent
        run: |
          uv run --frozen --extra test pytest -q
          uv run --frozen python -m compileall -q src tests
